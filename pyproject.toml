[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sso-auth"
version = "0.3.0"
description = "Programmatic SSO Keycloak authentication helper for sso.bps.go.id"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pydantic>=2",
    "pydantic-settings",
    "keyring",
    "typer",
    "rich",
]

[project.scripts]
sso-auth = "sso_auth.cli:run"

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
    "ruff",
    "mypy",
]
browser = [
    "playwright>=1.44",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
